<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>180-Day Protocol | Firebase Cloud Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, 
      signOut, onAuthStateChanged, sendPasswordResetEmail, GoogleAuthProvider, signInWithPopup, updateProfile 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ✅ YOUR ACTUAL FIREBASE PROJECT CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyC5mu2VsT483qfKCzYmWFDNhoPI4O_waK8",
      authDomain: "self-improvement-92ed0.firebaseapp.com",
      projectId: "self-improvement-92ed0",
      storageBucket: "self-improvement-92ed0.firebasestorage.app",
      messagingSenderId: "660035879429",
      appId: "1:660035879429:web:d4ea6953460eee6e03926c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    window.auth = auth;
    window.db = db;
    window.googleProvider = googleProvider;
    window.firebaseAuthOps = { 
      createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, 
      onAuthStateChanged, sendPasswordResetEmail, signInWithPopup, updateProfile,
      doc, setDoc, getDoc, onSnapshot, updateDoc
    };
  </script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .touch-target { min-height: 48px; }
  </style>
</head>
<body class="bg-black text-gray-100 min-h-screen pb-16 font-sans antialiased selection:bg-emerald-500 selection:text-white">

  <div id="authSection" class="max-w-md mx-auto px-4 pt-12 space-y-6">
    <div class="text-center space-y-2">
      <h1 class="text-2xl font-black text-emerald-400 tracking-wider">180-DAY PROTOCOL</h1>
      <p class="text-xs text-gray-400">Cloud Sync & Multi-Device Discipline Engine</p>
    </div>

    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-xl space-y-4">
      
      <div class="flex border-b border-gray-800 pb-2 text-sm font-bold">
        <button id="tabSignInBtn" class="flex-1 text-center py-1 text-emerald-400 border-b-2 border-emerald-400">Sign In</button>
        <button id="tabSignUpBtn" class="flex-1 text-center py-1 text-gray-500">Sign Up</button>
      </div>

      <form id="authForm" class="space-y-3">
        <div id="usernameContainer" class="hidden">
          <label class="text-[10px] uppercase font-bold text-gray-500 block mb-1">Username</label>
          <input type="text" id="authUsername" placeholder="John Doe" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500">
        </div>

        <div>
          <label class="text-[10px] uppercase font-bold text-gray-500 block mb-1">Email Address</label>
          <input type="email" id="authEmail" required placeholder="user@example.com" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500">
        </div>

        <div>
          <label class="text-[10px] uppercase font-bold text-gray-500 block mb-1">Password</label>
          <input type="password" id="authPassword" required placeholder="••••••••" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500">
        </div>

        <button type="submit" id="authSubmitBtn" class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 font-bold text-gray-950 rounded-xl transition text-sm">Sign In</button>
      </form>

      <div class="space-y-3 pt-2">
        <button id="btnForgotPassword" class="text-xs text-gray-400 hover:text-emerald-400 text-center w-full">Forgot Password?</button>
        
        <div class="relative flex py-1 items-center">
          <div class="flex-grow border-t border-gray-800"></div>
          <span class="flex-shrink mx-3 text-[10px] text-gray-500 font-bold uppercase">OR</span>
          <div class="flex-grow border-t border-gray-800"></div>
        </div>

        <button id="btnGoogleSignIn" class="w-full py-2.5 bg-gray-950 border border-gray-800 hover:bg-gray-800 font-semibold text-xs flex items-center justify-center space-x-2 rounded-xl transition">
          <span>Continue with Google</span>
        </button>
      </div>

      <p id="authErrorMsg" class="text-xs text-rose-500 text-center hidden"></p>
    </div>
  </div>

  <div id="appSection" class="max-w-md mx-auto px-4 pt-6 space-y-4 hidden">
    
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 shadow-lg flex items-center justify-between">
      <div>
        <span class="text-[10px] uppercase font-bold text-emerald-500 block">Logged In User</span>
        <h2 id="userDisplayName" class="text-base font-black text-gray-100">User</h2>
        <p id="userEmailDisplay" class="text-[10px] text-gray-400"></p>
      </div>
      <button id="btnLogout" class="px-3 py-1.5 bg-gray-950 border border-gray-800 hover:bg-rose-950 hover:text-rose-400 hover:border-rose-900/50 rounded-xl text-xs font-bold transition">Logout</button>
    </div>

    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 shadow-lg flex items-center justify-between">
      <div>
        <h1 class="text-base font-black tracking-wide text-emerald-400">180-DAY CHALLENGE</h1>
        <p id="currentDateDisplay" class="text-xs text-gray-400 font-medium"></p>
      </div>
      <div class="flex items-center space-x-2">
        <div class="text-center bg-gray-950 border border-gray-800 rounded-xl px-2.5 py-1.5">
          <span class="text-[9px] uppercase text-gray-500 font-bold block">Streak</span>
          <div id="streakCount" class="text-lg font-black text-orange-500 leading-none">0 🔥</div>
        </div>
        <div class="text-center bg-gray-950 border border-gray-800 rounded-xl px-2.5 py-1.5">
          <span class="text-[9px] uppercase text-gray-500 font-bold block">Score</span>
          <div id="overallScore" class="text-lg font-black text-emerald-400 leading-none">0%</div>
        </div>
      </div>
    </div>

    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 shadow-lg space-y-3">
      <div class="flex items-center justify-between mb-1">
        <h2 class="text-sm font-bold text-gray-200">Today's Protocol Rules</h2>
        <span id="completedCount" class="text-xs font-semibold px-2 py-0.5 bg-emerald-500/10 text-emerald-400 rounded-full border border-emerald-500/20">0/12 Done</span>
      </div>

      <div class="p-3.5 bg-gray-950 border border-gray-800 rounded-xl flex items-center justify-between">
        <div>
          <span class="text-sm font-semibold text-gray-200 block">Hydration Goal (3L) 💧</span>
          <span id="waterTextDisplay" class="text-[11px] text-sky-400 font-bold">0 / 3000 ml</span>
        </div>
        <div class="flex items-center space-x-1.5">
          <button id="btnAddWater" class="px-3 py-1.5 bg-sky-600/20 border border-sky-500/40 text-sky-400 hover:bg-sky-500 hover:text-black font-bold text-xs rounded-lg transition">+ 250ml</button>
          <button id="btnResetWater" class="px-2 py-1.5 bg-gray-900 text-gray-500 hover:text-gray-300 font-bold text-xs rounded-lg transition">↺</button>
        </div>
      </div>

      <form id="habitForm" class="space-y-2">
        <label id="lbl-wakeUp" class="touch-target flex items-center justify-between px-3.5 py-2.5 bg-gray-950 border border-gray-800 rounded-xl transition cursor-pointer">
          <span class="text-sm font-semibold text-gray-200">Wake up at 6:00 AM ⏰</span>
          <input type="checkbox" value="wakeUp" class="w-6 h-6 accent-emerald-500 rounded-md cursor-pointer">
        </label>
        <label id="lbl-workout" class="touch-target flex items-center justify-between px-3.5 py-2.5 bg-gray-950 border border-gray-800 rounded-xl transition cursor-pointer">
          <span class="text-sm font-semibold text-gray-200">Daily Workout / Gym 🏋️‍♂️</span>
          <input type="checkbox" value="workout" class="w-6 h-6 accent-emerald-500 rounded-md cursor-pointer">
        </label>
        <label id="lbl-reading" class="touch-target flex items-center justify-between px-3.5 py-2.5 bg-gray-950 border border-gray-800 rounded-xl transition cursor-pointer">
          <span class="text-sm font-semibold text-gray-200">Reading / Learning 📖</span>
          <input type="checkbox" value="reading" class="w-6 h-6 accent-emerald-500 rounded-md cursor-pointer">
        </label>
        <label id="lbl-dayPlanning" class="touch-target flex items-center justify-between px-3.5 py-2.5 bg-gray-950 border border-gray-800 rounded-xl transition cursor-pointer">
          <span class="text-sm font-semibold text-gray-200">Day Planning 📋</span>
          <input type="checkbox" value="dayPlanning" class="w-6 h-6 accent-emerald-500 rounded-md cursor-pointer">
        </label>
        <label id="lbl-budget" class="touch-target flex items-center justify-between px-3.5 py-2.5 bg-gray-950 border border-gray-800 rounded-xl transition cursor-pointer">
          <span class="text-sm font-semibold text-gray-200">Budget & Expense Tracking 💰</span>
          <input type="checkbox" value="budget" class="w-6 h-6 accent-emerald-500 rounded-md cursor-pointer">
        </label>
        <label id="lbl-deepWork" class="touch-target flex items-center justify-between px-3.5 py-2.5 bg-gray-950 border border-gray-800 rounded-xl transition cursor-pointer">
          <span class="text-sm font-semibold text-gray-200">Deep Work / Project Work 🎯</span>
          <input type="checkbox" value="deepWork" class="w-6 h-6 accent-emerald-500 rounded-md cursor-pointer">
        </label>
        <label id="lbl-coldShower" class="touch-target flex items-center justify-between px-3.5 py-2.5 bg-gray-950 border border-gray-800 rounded-xl transition cursor-pointer">
          <span class="text-sm font-semibold text-gray-200">Cold Shower 🧊</span>
          <input type="checkbox" value="coldShower" class="w-6 h-6 accent-emerald-500 rounded-md cursor-pointer">
        </label>
        <label id="lbl-detox" class="touch-target flex items-center justify-between px-3.5 py-2.5 bg-gray-950 border border-gray-800 rounded-xl transition cursor-pointer">
          <span class="text-sm font-semibold text-gray-200">Social Media Detox 🍃</span>
          <input type="checkbox" value="detox" class="w-6 h-6 accent-emerald-500 rounded-md cursor-pointer">
        </label>
        <label id="lbl-noPorn" class="touch-target flex items-center justify-between px-3.5 py-2.5 bg-gray-950 border border-gray-800 rounded-xl transition cursor-pointer">
          <span class="text-sm font-semibold text-gray-200">No Adult Content / Retention 🚫</span>
          <input type="checkbox" value="noPorn" class="w-6 h-6 accent-emerald-500 rounded-md cursor-pointer">
        </label>
        <label id="lbl-noSmoke" class="touch-target flex items-center justify-between px-3.5 py-2.5 bg-gray-950 border border-gray-800 rounded-xl transition cursor-pointer">
          <span class="text-sm font-semibold text-gray-200">No Smoking / Nicotine 🚭</span>
          <input type="checkbox" value="noSmoke" class="w-6 h-6 accent-emerald-500 rounded-md cursor-pointer">
        </label>
        <label id="lbl-noAlcohol" class="touch-target flex items-center justify-between px-3.5 py-2.5 bg-gray-950 border border-gray-800 rounded-xl transition cursor-pointer">
          <span class="text-sm font-semibold text-gray-200">No Alcohol 🍷</span>
          <input type="checkbox" value="noAlcohol" class="w-6 h-6 accent-emerald-500 rounded-md cursor-pointer">
        </label>
      </form>
    </div>

    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 shadow-lg">
      <div class="flex items-center justify-between mb-3">
        <h2 id="calendarMonthYear" class="text-sm font-bold text-gray-200">Month Overview</h2>
      </div>
      <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-gray-500 mb-2">
        <div>SU</div><div>MO</div><div>TU</div><div>WE</div><div>TH</div><div>FR</div><div>SA</div>
      </div>
      <div id="calendarGrid" class="grid grid-cols-7 gap-1 text-center text-xs font-semibold"></div>
    </div>

  </div>

  <script type="module">
    const authSection = document.getElementById('authSection');
    const appSection = document.getElementById('appSection');
    const authForm = document.getElementById('authForm');
    const tabSignInBtn = document.getElementById('tabSignInBtn');
    const tabSignUpBtn = document.getElementById('tabSignUpBtn');
    const usernameContainer = document.getElementById('usernameContainer');
    const authSubmitBtn = document.getElementById('authSubmitBtn');
    const authErrorMsg = document.getElementById('authErrorMsg');

    let isSignUpState = false;
    let currentUser = null;
    let trackerData = {};
    const todayKey = new Date().toISOString().split('T')[0];
    const totalHabitItems = 12; // 11 Checkboxes + Water Goal

    // Auth State Toggle
    tabSignInBtn.addEventListener('click', () => {
      isSignUpState = false;
      tabSignInBtn.className = "flex-1 text-center py-1 text-emerald-400 border-b-2 border-emerald-400";
      tabSignUpBtn.className = "flex-1 text-center py-1 text-gray-500";
      usernameContainer.classList.add('hidden');
      authSubmitBtn.textContent = "Sign In";
    });

    tabSignUpBtn.addEventListener('click', () => {
      isSignUpState = true;
      tabSignUpBtn.className = "flex-1 text-center py-1 text-emerald-400 border-b-2 border-emerald-400";
      tabSignInBtn.className = "flex-1 text-center py-1 text-gray-500";
      usernameContainer.classList.remove('hidden');
      authSubmitBtn.textContent = "Sign Up";
    });

    // Firebase Auth Handlers
    setTimeout(() => {
      const { 
        createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, 
        onAuthStateChanged, sendPasswordResetEmail, signInWithPopup, updateProfile,
        doc, setDoc, onSnapshot
      } = window.firebaseAuthOps;

      onAuthStateChanged(window.auth, (user) => {
        if (user) {
          currentUser = user;
          authSection.classList.add('hidden');
          appSection.classList.remove('hidden');
          document.getElementById('userDisplayName').textContent = user.displayName || user.email.split('@')[0];
          document.getElementById('userEmailDisplay').textContent = user.email;
          document.getElementById('currentDateDisplay').textContent = new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

          // Listen to Cloud Firestore Data Real-time
          const userDocRef = doc(window.db, "users", user.uid);
          onSnapshot(userDocRef, (docSnap) => {
            if (docSnap.exists()) {
              trackerData = docSnap.data().habits || {};
            } else {
              trackerData = {};
            }
            if (!trackerData[todayKey]) {
              trackerData[todayKey] = { water: 0 };
            }
            updateUI();
          });

        } else {
          currentUser = null;
          appSection.classList.add('hidden');
          authSection.classList.remove('hidden');
        }
      });

      // Submit Sign In / Sign Up
      authForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        authErrorMsg.classList.add('hidden');
        const email = document.getElementById('authEmail').value;
        const password = document.getElementById('authPassword').value;
        const username = document.getElementById('authUsername').value;

        try {
          if (isSignUpState) {
            const res = await createUserWithEmailAndPassword(window.auth, email, password);
            if (username) {
              await updateProfile(res.user, { displayName: username });
            }
            await setDoc(doc(window.db, "users", res.user.uid), { habits: {} });
          } else {
            await signInWithEmailAndPassword(window.auth, email, password);
          }
        } catch (err) {
          authErrorMsg.textContent = err.message.replace("Firebase: ", "");
          authErrorMsg.classList.remove('hidden');
        }
      });

      // Google Sign-In
      document.getElementById('btnGoogleSignIn').addEventListener('click', async () => {
        try {
          await signInWithPopup(window.auth, window.googleProvider);
        } catch (err) {
          authErrorMsg.textContent = err.message;
          authErrorMsg.classList.remove('hidden');
        }
      });

      // Password Reset
      document.getElementById('btnForgotPassword').addEventListener('click', async () => {
        const email = document.getElementById('authEmail').value;
        if (!email) {
          alert("Please enter your email address first!");
          return;
        }
        try {
          await sendPasswordResetEmail(window.auth, email);
          alert("Password reset email sent!");
        } catch (err) {
          alert(err.message);
        }
      });

      // Logout
      document.getElementById('btnLogout').addEventListener('click', () => {
        signOut(window.auth);
      });
    }, 1000);

    // Dynamic UI Updates & Database Sync
    const checkboxes = document.querySelectorAll('input[type="checkbox"]');
    checkboxes.forEach(cb => {
      cb.addEventListener('change', async (e) => {
        if (!trackerData[todayKey]) trackerData[todayKey] = { water: 0 };
        trackerData[todayKey][e.target.value] = e.target.checked;
        saveDataToCloud();
      });
    });

    // Water Tracker Buttons
    document.getElementById('btnAddWater').addEventListener('click', () => {
      if (!trackerData[todayKey]) trackerData[todayKey] = { water: 0 };
      const currentWater = trackerData[todayKey].water || 0;
      trackerData[todayKey].water = Math.min(3000, currentWater + 250);
      saveDataToCloud();
    });

    document.getElementById('btnResetWater').addEventListener('click', () => {
      if (!trackerData[todayKey]) trackerData[todayKey] = { water: 0 };
      trackerData[todayKey].water = 0;
      saveDataToCloud();
    });

    async function saveDataToCloud() {
      if (currentUser) {
        const { doc, setDoc } = window.firebaseAuthOps;
        await setDoc(doc(window.db, "users", currentUser.uid), { habits: trackerData }, { merge: true });
      }
    }

    function updateUI() {
      // 1. Set Checkboxes State
      checkboxes.forEach(cb => {
        const isChecked = trackerData[todayKey] ? (trackerData[todayKey][cb.value] || false) : false;
        cb.checked = isChecked;
        const label = document.getElementById(`lbl-${cb.value}`);
        if (isChecked) {
          label.classList.add('border-emerald-500/40', 'bg-emerald-950/20');
        } else {
          label.classList.remove('border-emerald-500/40', 'bg-emerald-950/20');
        }
      });

      // 2. Set Water Progress
      const waterMl = trackerData[todayKey] ? (trackerData[todayKey].water || 0) : 0;
      document.getElementById('waterTextDisplay').textContent = `${waterMl} / 3000 ml`;

      // 3. Calculate Today's Completion Score
      const currentDayData = trackerData[todayKey] || {};
      let completedCount = Object.keys(currentDayData).filter(k => k !== 'water' && currentDayData[k]).length;
      if (waterMl >= 3000) completedCount += 1;
      
      const todayPercentage = Math.round((completedCount / totalHabitItems) * 100);

      document.getElementById('completedCount').textContent = `${completedCount}/${totalHabitItems} Done`;
      document.getElementById('overallScore').textContent = `${todayPercentage}%`;

      // 4. Calculate Streak Count (Days with 100% score)
      let streak = 0;
      let checkDate = new Date();
      while (true) {
        const dateStr = checkDate.toISOString().split('T')[0];
        const dayLogs = trackerData[dateStr];
        if (dayLogs) {
          let dayDone = Object.keys(dayLogs).filter(k => k !== 'water' && dayLogs[k]).length;
          if ((dayLogs.water || 0) >= 3000) dayDone += 1;
          
          if (dayDone === totalHabitItems) {
            streak++;
            checkDate.setDate(checkDate.getDate() - 1);
          } else {
            break;
          }
        } else {
          break;
        }
      }
      document.getElementById('streakCount').textContent = `${streak} 🔥`;

      // 5. Render Calendar View
      renderCalendar();
    }

    function renderCalendar() {
      const calendarGrid = document.getElementById('calendarGrid');
      if (!calendarGrid) return;
      calendarGrid.innerHTML = '';
      
      const today = new Date();
      const year = today.getFullYear();
      const month = today.getMonth();
      document.getElementById('calendarMonthYear').textContent = today.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        calendarGrid.appendChild(document.createElement('div'));
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const cell = document.createElement('div');
        cell.className = 'py-2 rounded-lg border text-center font-medium transition';

        const dayData = trackerData[dateStr];
        let score = 0;
        if (dayData) {
          let completed = Object.keys(dayData).filter(k => k !== 'water' && dayData[k]).length;
          if ((dayData.water || 0) >= 3000) completed += 1;
          score = (completed / totalHabitItems) * 100;
        }

        if (score === 100) cell.classList.add('bg-emerald-500/20', 'border-emerald-500/50', 'text-emerald-300');
        else if (score > 0) cell.classList.add('bg-amber-500/20', 'border-amber-500/50', 'text-amber-300');
        else cell.classList.add('bg-gray-950', 'border-gray-800', 'text-gray-500');

        cell.textContent = day;
        calendarGrid.appendChild(cell);
      }
    }
  </script>
</body>
</html>

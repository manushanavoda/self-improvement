<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>180-Day Transformation Protocol</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .touch-target { min-height: 48px; }
  </style>
</head>
<body class="bg-black text-gray-100 min-h-screen pb-12 font-sans antialiased selection:bg-emerald-500 selection:text-white">

  <div class="max-w-md mx-auto px-4 pt-6 space-y-4">
    
    <!-- Mobile Header -->
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 shadow-lg flex items-center justify-between">
      <div>
        <h1 class="text-lg font-black tracking-wide text-emerald-400">180-DAY PROTOCOL</h1>
        <p id="currentDateDisplay" class="text-xs text-gray-400 mt-0.5 font-medium"></p>
      </div>
      <div class="flex items-center space-x-2">
        <div class="text-center bg-gray-950 border border-gray-800 rounded-xl px-2.5 py-1.5">
          <span class="text-[9px] uppercase text-gray-500 font-bold block">Streak</span>
          <div id="streakCount" class="text-xl font-black text-orange-500 leading-none">0 🔥</div>
        </div>
        <div class="text-center bg-gray-950 border border-gray-800 rounded-xl px-2.5 py-1.5">
          <span class="text-[9px] uppercase text-gray-500 font-bold block">Score</span>
          <div id="overallScore" class="text-xl font-black text-emerald-400 leading-none">0%</div>
        </div>
      </div>
    </div>

    <!-- Daily Checklist -->
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 shadow-lg">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-bold text-gray-200">Daily Non-Negotiables</h2>
        <span id="completedCount" class="text-xs font-semibold px-2 py-0.5 bg-emerald-500/10 text-emerald-400 rounded-full border border-emerald-500/20">0/6 Done</span>
      </div>

      <form id="habitForm" class="space-y-2">
        <label id="lbl-wakeUp" class="touch-target flex items-center justify-between px-3.5 py-2.5 bg-gray-950 border border-gray-800 rounded-xl transition cursor-pointer">
          <span class="text-sm font-semibold text-gray-200">Wake up at 6:00 AM ⏰</span>
          <input type="checkbox" value="wakeUp" class="w-6 h-6 accent-emerald-500 rounded-md cursor-pointer">
        </label>

        <label id="lbl-workout" class="touch-target flex items-center justify-between px-3.5 py-2.5 bg-gray-950 border border-gray-800 rounded-xl transition cursor-pointer">
          <span class="text-sm font-semibold text-gray-200">Daily Workout / Fitness 🏋️‍♂️</span>
          <input type="checkbox" value="workout" class="w-6 h-6 accent-emerald-500 rounded-md cursor-pointer">
        </label>

        <label id="lbl-noPorn" class="touch-target flex items-center justify-between px-3.5 py-2.5 bg-gray-950 border border-gray-800 rounded-xl transition cursor-pointer">
          <span class="text-sm font-semibold text-gray-200">No Adult Content / Retention 🚫</span>
          <input type="checkbox" value="noPorn" class="w-6 h-6 accent-emerald-500 rounded-md cursor-pointer">
        </label>

        <label id="lbl-noSmoke" class="touch-target flex items-center justify-between px-3.5 py-2.5 bg-gray-950 border border-gray-800 rounded-xl transition cursor-pointer">
          <span class="text-sm font-semibold text-gray-200">No Smoking / Nicotine 🚭</span>
          <input type="checkbox" value="noSmoke" class="w-6 h-6 accent-emerald-500 rounded-md cursor-pointer">
        </label>

        <label id="lbl-noAlcohol" class="touch-target flex items-center justify-between px-3.5 py-2.5 bg-gray-950 border border-gray-800 rounded-xl transition cursor-pointer">
          <span class="text-sm font-semibold text-gray-200">No Alcohol 📵</span>
          <input type="checkbox" value="noAlcohol" class="w-6 h-6 accent-emerald-500 rounded-md cursor-pointer">
        </label>

        <label id="lbl-deepWork" class="touch-target flex items-center justify-between px-3.5 py-2.5 bg-gray-950 border border-gray-800 rounded-xl transition cursor-pointer">
          <span class="text-sm font-semibold text-gray-200">Deep Work / Skill Building 📚</span>
          <input type="checkbox" value="deepWork" class="w-6 h-6 accent-emerald-500 rounded-md cursor-pointer">
        </label>
      </form>
    </div>

    <!-- Water Intake Counter -->
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 shadow-lg flex items-center justify-between">
      <div>
        <h3 class="text-sm font-bold text-gray-200">Hydration Tracker 💧</h3>
        <p class="text-xs text-gray-400">Target: 3.5 Liters (7 Glasses)</p>
      </div>
      <div class="flex items-center space-x-3">
        <button id="btnMinusWater" class="w-8 h-8 rounded-lg bg-gray-800 border border-gray-700 font-bold text-lg flex items-center justify-center active:bg-gray-700">-</button>
        <span id="waterCountDisplay" class="text-base font-black text-cyan-400">0/7</span>
        <button id="btnPlusWater" class="w-8 h-8 rounded-lg bg-gray-800 border border-gray-700 font-bold text-lg flex items-center justify-center active:bg-gray-700">+</button>
      </div>
    </div>

    <!-- Daily Mindset Journal -->
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 shadow-lg space-y-2">
      <h3 class="text-sm font-bold text-gray-200">Daily Journal / Reflection 📝</h3>
      <textarea id="journalInput" rows="2" placeholder="Write thoughts or main focus for today..." class="w-full bg-gray-950 border border-gray-800 rounded-xl p-2.5 text-xs text-gray-200 focus:outline-none focus:border-emerald-500/50 resize-none"></textarea>
    </div>

    <!-- Mobile Trend Chart -->
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 shadow-lg">
      <h2 class="text-sm font-bold text-gray-200 mb-1">7-Day Consistency Trend</h2>
      <div class="relative h-44 w-full">
        <canvas id="consistencyChart"></canvas>
      </div>
    </div>

  </div>

  <script>
    const todayKey = new Date().toISOString().split('T')[0];
    document.getElementById('currentDateDisplay').textContent = new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

    let trackerData = JSON.parse(localStorage.getItem('transformationDataPro')) || {};
    if (!trackerData[todayKey]) {
      trackerData[todayKey] = { wakeUp: false, workout: false, noPorn: false, noSmoke: false, noAlcohol: false, deepWork: false, water: 0, journal: "" };
    }

    // Chart Setup
    const ctx = document.getElementById('consistencyChart').getContext('2d');
    const consistencyChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: Object.keys(trackerData).slice(-7),
        datasets: [{
          label: 'Completion %',
          data: [],
          borderColor: '#10b981',
          borderWidth: 2,
          pointBackgroundColor: '#10b981',
          backgroundColor: 'rgba(16, 185, 129, 0.12)',
          fill: true,
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: { min: 0, max: 100, ticks: { color: '#6b7280', stepSize: 50 }, grid: { color: '#1f2937' } },
          x: { ticks: { color: '#6b7280' }, grid: { display: false } }
        },
        plugins: { legend: { display: false } }
      }
    });

    const checkboxes = document.querySelectorAll('input[type="checkbox"]');
    const journalInput = document.getElementById('journalInput');

    // Load initial habit state
    checkboxes.forEach(cb => {
      const isChecked = trackerData[todayKey][cb.value] || false;
      cb.checked = isChecked;
      updateLabelStyle(cb.value, isChecked);

      cb.addEventListener('change', (e) => {
        trackerData[todayKey][e.target.value] = e.target.checked;
        updateLabelStyle(e.target.value, e.target.checked);
        saveAndUpdate();
      });
    });

    // Water counter handlers
    document.getElementById('btnPlusWater').addEventListener('click', () => {
      if ((trackerData[todayKey].water || 0) < 7) {
        trackerData[todayKey].water = (trackerData[todayKey].water || 0) + 1;
        saveAndUpdate();
      }
    });

    document.getElementById('btnMinusWater').addEventListener('click', () => {
      if ((trackerData[todayKey].water || 0) > 0) {
        trackerData[todayKey].water -= 1;
        saveAndUpdate();
      }
    });

    // Journal handler
    journalInput.value = trackerData[todayKey].journal || "";
    journalInput.addEventListener('input', (e) => {
      trackerData[todayKey].journal = e.target.value;
      localStorage.setItem('transformationDataPro', JSON.stringify(trackerData));
    });

    function updateLabelStyle(key, isChecked) {
      const parentLabel = document.getElementById(`lbl-${key}`);
      if (isChecked) {
        parentLabel.classList.add('border-emerald-500/40', 'bg-emerald-950/20');
        parentLabel.classList.remove('border-gray-800', 'bg-gray-950');
      } else {
        parentLabel.classList.remove('border-emerald-500/40', 'bg-emerald-950/20');
        parentLabel.classList.add('border-gray-800', 'bg-gray-950');
      }
    }

    function calculateStreak() {
      const dates = Object.keys(trackerData).sort();
      let streak = 0;
      for (let i = dates.length - 1; i >= 0; i--) {
        const d = dates[i];
        const habits = trackerData[d];
        const completed = Object.keys(habits).filter(k => ['wakeUp','workout','noPorn','noSmoke','noAlcohol','deepWork'].includes(k) && habits[k]).length;
        if (completed === 6) {
          streak++;
        } else if (d !== todayKey) {
          break;
        }
      }
      return streak;
    }

    function saveAndUpdate() {
      localStorage.setItem('transformationDataPro', JSON.stringify(trackerData));
      
      const dates = Object.keys(trackerData);
      let totalCompleted = 0;
      let totalPossible = dates.length * 6;

      dates.forEach(d => {
        totalCompleted += Object.keys(trackerData[d]).filter(k => ['wakeUp','workout','noPorn','noSmoke','noAlcohol','deepWork'].includes(k) && trackerData[d][k]).length;
      });

      const todayCompleted = Object.keys(trackerData[todayKey]).filter(k => ['wakeUp','workout','noPorn','noSmoke','noAlcohol','deepWork'].includes(k) && trackerData[todayKey][k]).length;
      document.getElementById('completedCount').textContent = `${todayCompleted}/6 Done`;
      document.getElementById('waterCountDisplay').textContent = `${trackerData[todayKey].water || 0}/7`;
      document.getElementById('streakCount').textContent = `${calculateStreak()} 🔥`;

      const overallPercentage = Math.round((totalCompleted / totalPossible) * 100) || 0;
      document.getElementById('overallScore').textContent = `${overallPercentage}%`;

      consistencyChart.data.labels = dates.slice(-7).map(d => d.slice(5));
      consistencyChart.data.datasets[0].data = dates.slice(-7).map(date => {
        const habits = trackerData[date];
        const completed = Object.keys(habits).filter(k => ['wakeUp','workout','noPorn','noSmoke','noAlcohol','deepWork'].includes(k) && habits[k]).length;
        return Math.round((completed / 6) * 100);
      });
      consistencyChart.update();
    }

    saveAndUpdate();
  </script>
</body>
</html>
